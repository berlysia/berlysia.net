# Renovate regenerates the lockfile in its own environment, where the
# user-level pnpm rc is absent. Keep the release-age gate in the repo so
# transitive dependencies resolved there are held to the same 7-day rule.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - "@berlysia/*"
  # Renovate security update: vite@8.3.3
  - vite@8.3.3
  # Renovate security update: hono@4.13.11
  - hono@4.13.11
